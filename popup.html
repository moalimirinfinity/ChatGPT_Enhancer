<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>ChatGPT Direction Fix</title>
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <div class="panel__badge panel__badge--author">@moalimirinfinity</div>
        <div class="panel__badge panel__badge--tag">RTL ↔ LTR</div>
        <h1 class="panel__title">Direction Fix</h1>
        <p class="panel__subtitle">
          Keep KaTeX math and code readable in right-to-left conversations—crafted by
          <span class="panel__highlight">moalimirinfinity</span>.
        </p>
      </header>

      <section class="panel__section">
        <label class="toggle">
          <input type="checkbox" id="toggle-enable" class="toggle__input" />
          <span class="toggle__track">
            <span class="toggle__thumb"></span>
          </span>
          <div class="toggle__content">
            <span class="toggle__title">Enable extension</span>
            <span class="toggle__hint">
              Turn direction fixes on for ChatGPT conversations.
            </span>
          </div>
        </label>
      </section>

      <section class="panel__section panel__section--compact">
        <h2 class="panel__section-title">Choose what to stabilize</h2>
        <label class="toggle toggle--sub">
          <input type="checkbox" id="toggle-katex" class="toggle__input" />
          <span class="toggle__track">
            <span class="toggle__thumb"></span>
          </span>
          <div class="toggle__content">
            <span class="toggle__title">KaTeX formulas</span>
            <span class="toggle__hint">Lock math layout left-to-right.</span>
          </div>
        </label>

        <label class="toggle toggle--sub">
          <input type="checkbox" id="toggle-code" class="toggle__input" />
          <span class="toggle__track">
            <span class="toggle__thumb"></span>
          </span>
          <div class="toggle__content">
            <span class="toggle__title">Code blocks</span>
            <span class="toggle__hint">Keep snippets readable and aligned.</span>
          </div>
        </label>

        <label class="toggle toggle--sub">
          <input type="checkbox" id="toggle-tables" class="toggle__input" />
          <span class="toggle__track">
            <span class="toggle__thumb"></span>
          </span>
          <div class="toggle__content">
            <span class="toggle__title">Tables</span>
            <span class="toggle__hint">Prevent table columns from flipping.</span>
          </div>
        </label>
      </section>

      <section class="panel__section panel__section--donate">
        <div class="donate-card">
          <div class="donate-card__copy">
            <h2 class="donate-card__title">Support the project</h2>
            <p class="donate-card__subtitle">
              If this extension helps, you can chip in with a Rial donation through ZarinPal (زرین‌پال).
            </p>
          </div>
          <button id="donate-btn" class="donate-card__button" type="button">
            Donate (Rial)
          </button>
        </div>
      </section>

      <footer class="panel__footer">
        <span id="status-chip" class="status-chip status-chip--active">Active</span>
        <button id="refresh-btn" class="refresh-btn" type="button">
          Refresh ChatGPT
        </button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
