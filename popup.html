<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>GPT Enhancer</title>
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1 class="panel__title">GPT Enhancer</h1>
        <p class="panel__subtitle">
          Tune ChatGPT layouts, KaTeX, and themes for a cleaner experience.
        </p>
      </header>

      <section class="panel__section">
        <label class="toggle">
          <input type="checkbox" id="toggle-enable" class="toggle__input" />
          <span class="toggle__track">
            <span class="toggle__thumb"></span>
          </span>
          <div class="toggle__content">
            <span class="toggle__title">Enable extension</span>
            <span class="toggle__hint">
              Turn direction fixes on for ChatGPT conversations.
            </span>
          </div>
        </label>
      </section>

      <section class="panel__section panel__section--accordion">
        <button
          class="accordion__header"
          type="button"
          aria-controls="fonts-section"
          aria-expanded="false"
          data-target="fonts-section"
        >
          <span class="panel__section-title">Fonts</span>
          <span class="accordion__icon" aria-hidden="true">></span>
        </button>
        <div id="fonts-section" class="accordion__content">
          <label class="toggle toggle--sub">
            <input type="checkbox" id="toggle-fonts" class="toggle__input" />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <div class="toggle__content">
              <span class="toggle__title">Font control</span>
              <span class="toggle__hint">Apply curated fonts to conversation text.</span>
            </div>
          </label>
          <div class="font-control" aria-live="polite">
            <div class="font-tabs" role="tablist" aria-label="Select language">
              <button
                class="font-tab is-active"
                type="button"
                id="font-tab-english"
                data-lang="english"
                role="tab"
                aria-selected="true"
              >
                English
              </button>
              <button
                class="font-tab"
                type="button"
                id="font-tab-persian"
                data-lang="persian"
                role="tab"
                aria-selected="false"
              >
                Persian
              </button>
            </div>
            <div
              class="font-options is-active"
              data-lang="english"
              role="tabpanel"
              aria-labelledby="font-tab-english"
            >
              <button
                class="font-option is-active"
                type="button"
                data-lang="english"
                data-value="inter"
                aria-pressed="true"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;"
                >
                  <span class="font-option__label">Inter</span>
                  <span class="font-option__preview">Sample text</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="english"
                data-value="source-sans-3"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;"
                >
                  <span class="font-option__label">Source Sans 3</span>
                  <span class="font-option__preview">Sample text</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="english"
                data-value="roboto"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;"
                >
                  <span class="font-option__label">Roboto</span>
                  <span class="font-option__preview">Sample text</span>
                </div>
                <span class="font-option__meta">Apache 2.0</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="english"
                data-value="noto-sans"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;"
                >
                  <span class="font-option__label">Noto Sans</span>
                  <span class="font-option__preview">Sample text</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="english"
                data-value="work-sans"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Work Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;"
                >
                  <span class="font-option__label">Work Sans</span>
                  <span class="font-option__preview">Sample text</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
            </div>
            <div
              class="font-options"
              data-lang="persian"
              role="tabpanel"
              aria-labelledby="font-tab-persian"
              hidden
            >
              <button
                class="font-option is-active"
                type="button"
                data-lang="persian"
                data-value="vazirmatn"
                aria-pressed="true"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Vazirmatn', 'Noto Sans Arabic', 'Tahoma', sans-serif;"
                >
                  <span class="font-option__label">وزیرمتن</span>
                  <span class="font-option__preview">نمونهٔ متن زیبا</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="persian"
                data-value="noto-naskh-arabic"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Noto Naskh Arabic', 'Vazirmatn', 'Tahoma', sans-serif;"
                >
                  <span class="font-option__label">نوتو نسخ عربی</span>
                  <span class="font-option__preview">نمونهٔ متن زیبا</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="persian"
                data-value="noto-sans-arabic"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Noto Sans Arabic', 'Vazirmatn', 'Tahoma', sans-serif;"
                >
                  <span class="font-option__label">نوتو سنس عربی</span>
                  <span class="font-option__preview">نمونهٔ متن زیبا</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="persian"
                data-value="sahel"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Sahel', 'Vazirmatn', 'Tahoma', sans-serif;"
                >
                  <span class="font-option__label">ساحل</span>
                  <span class="font-option__preview">نمونهٔ متن زیبا</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
              <button
                class="font-option"
                type="button"
                data-lang="persian"
                data-value="shabnam"
                aria-pressed="false"
              >
                <div
                  class="font-option__details"
                  style="font-family: 'Shabnam', 'Vazirmatn', 'Tahoma', sans-serif;"
                >
                  <span class="font-option__label">شبنم</span>
                  <span class="font-option__preview">نمونهٔ متن زیبا</span>
                </div>
                <span class="font-option__meta">OFL</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel__section panel__section--accordion">
        <button
          class="accordion__header"
          type="button"
          aria-controls="stabilize-section"
          aria-expanded="false"
          data-target="stabilize-section"
        >
          <span class="panel__section-title">Choose what to stabilize</span>
          <span class="accordion__icon" aria-hidden="true">></span>
        </button>
        <div id="stabilize-section" class="accordion__content">
          <label class="toggle toggle--sub">
            <input type="checkbox" id="toggle-katex" class="toggle__input" />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <div class="toggle__content">
              <span class="toggle__title">KaTeX formulas</span>
              <span class="toggle__hint">Lock math layout left-to-right.</span>
            </div>
          </label>

          <label class="toggle toggle--sub">
            <input type="checkbox" id="toggle-code" class="toggle__input" />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <div class="toggle__content">
              <span class="toggle__title">Code blocks</span>
              <span class="toggle__hint">Keep snippets readable and aligned.</span>
            </div>
          </label>

          <label class="toggle toggle--sub">
            <input type="checkbox" id="toggle-tables" class="toggle__input" />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <div class="toggle__content">
              <span class="toggle__title">Tables</span>
              <span class="toggle__hint">Prevent table columns from flipping.</span>
            </div>
          </label>

          <label class="toggle toggle--sub">
            <input type="checkbox" id="toggle-copy" class="toggle__input" />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <div class="toggle__content">
              <span class="toggle__title">Click to copy equations</span>
              <span class="toggle__hint">Tap any KaTeX formula to grab its LaTeX.</span>
            </div>
          </label>
        </div>
      </section>

      <section class="panel__section panel__section--accordion">
        <button
          class="accordion__header"
          type="button"
          aria-controls="theme-section"
          aria-expanded="false"
          data-target="theme-section"
        >
          <span class="panel__section-title">Theme</span>
          <span class="accordion__icon" aria-hidden="true">></span>
        </button>
        <div id="theme-section" class="accordion__content">
          <div class="theme-picker" role="radiogroup" aria-label="ChatGPT theme">
          <button
            class="theme-card"
            type="button"
            data-theme="original"
            aria-label="Original theme"
            aria-pressed="false"
          >
            <span class="theme-card__figure">
              <span class="theme-card__swatch theme-card__swatch--original"></span>
            </span>
            <span class="theme-card__label">Original</span>
          </button>
          <button
            class="theme-card"
            type="button"
            data-theme="midnight"
            aria-label="Midnight theme"
            aria-pressed="false"
          >
            <span class="theme-card__figure">
              <span class="theme-card__swatch theme-card__swatch--midnight"></span>
              <span class="theme-card__hint" aria-hidden="true">For Dark Theme</span>
            </span>
            <span class="theme-card__label">Midnight</span>
          </button>
          <button
            class="theme-card"
            type="button"
            data-theme="aurora"
            aria-label="Aurora theme"
            aria-pressed="false"
          >
            <span class="theme-card__figure">
              <span class="theme-card__swatch theme-card__swatch--aurora"></span>
              <span class="theme-card__hint" aria-hidden="true">For Dark Theme</span>
            </span>
            <span class="theme-card__label">Aurora</span>
          </button>
          <button
            class="theme-card"
            type="button"
            data-theme="paper"
            aria-label="Paper theme"
            aria-pressed="false"
          >
            <span class="theme-card__figure">
              <span class="theme-card__swatch theme-card__swatch--paper"></span>
              <span class="theme-card__hint" aria-hidden="true">For Light Theme</span>
            </span>
            <span class="theme-card__label">Paper</span>
          </button>
        </div>
        </div>
      </section>

      <section class="panel__section panel__section--accordion">
        <button
          class="accordion__header"
          type="button"
          aria-controls="export-section"
          aria-expanded="false"
          data-target="export-section"
        >
          <span class="panel__section-title">Export</span>
          <span class="accordion__icon" aria-hidden="true">></span>
        </button>
        <div id="export-section" class="accordion__content">
          <div class="export-controls">
            <span class="export-controls__title panel__section-title">Export format</span>
            <div class="export-segment" role="radiogroup" aria-label="Select export format">
              <label
                class="export-segment__option"
                data-tooltip="Export is not precise yet—we're working on it."
              >
                <input
                  class="export-segment__input"
                  type="radio"
                  name="export-format"
                  id="export-format-pdf"
                  value="pdf"
                  aria-describedby="export-tooltip-message"
                  checked
                />
                <span class="export-segment__label">PDF</span>
              </label>
              <label
                class="export-segment__option"
                data-tooltip="Export is not precise yet—we're working on it."
              >
                <input
                  class="export-segment__input"
                  type="radio"
                  name="export-format"
                  id="export-format-docx"
                  value="docx"
                  aria-describedby="export-tooltip-message"
                />
                <span class="export-segment__label">Word</span>
              </label>
            </div>
          </div>
          <button
            id="export-btn"
            class="export-btn"
            type="button"
            data-tooltip="Export is not precise yet—we're working on it."
            aria-describedby="export-tooltip-message"
          >
            Export conversation
          </button>
          <span id="export-tooltip-message" class="visually-hidden">
            Export is not precise yet—we're working on it.
          </span>
        </div>
      </section>

      <footer class="panel__footer">
        <button id="donate-btn" class="support-chip" type="button">Support</button>
        <button id="refresh-btn" class="refresh-btn" type="button">
          Refresh ChatGPT
        </button>
      </footer>
      <p class="panel__author">
        Created by
        <a
          class="panel__author-link"
          href="https://t.me/moalimir"
          target="_blank"
          rel="noopener noreferrer"
        >
          @moalimirinfinity
        </a>
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
